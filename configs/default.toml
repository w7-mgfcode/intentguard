[project]
name = "intentguard"
seed = 42

[data]
dataset_id = "PolyAI/banking77"
dataset_revision = "1fb62b1bb4635df59a8e1b2f2bc5e0643b2856c8"
validation_fraction = 0.15

[baseline]
lowercase = true
ngram_min = 1
ngram_max = 2
max_features = 50000
min_df = 1
sublinear_tf = true
solver = "lbfgs"
regularization_c = 1.0
max_iter = 1000
class_weight = "balanced"

[model]
base_model_id = "distilbert/distilbert-base-uncased"
base_model_revision = "12040accade4e8a0f71eabdb258fecc2e7e948be"

[training]
max_sequence_length = 96
threshold_source = "validation"
epochs = 2
train_batch_size = 16
eval_batch_size = 32
learning_rate = 2e-5
weight_decay = 0.01
warmup_ratio = 0.1
max_grad_norm = 1.0
selection_metric = "validation_macro_f1"

[threshold]
minimum_coverage = 0.70
objective = "selective_risk"

[paths]
data_root = "data"
artifact_root = "artifacts"
report_root = "reports"

[status]
allowed = ["Implemented", "Measured", "Partial", "Mocked", "Blocked", "Planned"]
