name: CPU validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
          python-version: "3.11"
          enable-cache: true
      - name: Install locked environment
        run: make setup
      - name: Lint and validate foundation
        run: make lint
      - name: Run foundation tests
        run: make test

      # The audit runs here in its degraded mode: a clean runner has no sealed artifact
      # and no Hugging Face cache, so the artifact-backed rows report `not_evidenced`
      # with a reason. It still exercises the ownership contract and the verdict rules,
      # and its verdict matches a fully-evidenced local run because environmental gaps
      # are reported separately from failure causes.
      #
      # The script exits non-zero while any MUST capability is Planned, which is the
      # truthful state today. `continue-on-error` is used rather than `|| true` so the
      # step's real exit status stays visible in the run summary: masking it would make
      # a failing gate render as a pass, which is the one thing this gate exists to
      # prevent. Remove it once the verdict is expected to be PASS.
      - name: Audit acceptance evidence
        run: make acceptance
        continue-on-error: true
