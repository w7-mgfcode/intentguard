name: CPU validation

on:
  push:
  pull_request:
  # Manual dispatch validates an exact ref after an infrastructure non-result,
  # without manufacturing a commit. An empty commit would evidence a different
  # tree, and re-running an older run evidences the older head; either would
  # attribute a verdict to something other than what was audited.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
          python-version: "3.11"
          enable-cache: true
      - name: Install locked environment
        run: make setup
      - name: Lint and validate foundation
        run: make lint
      - name: Run foundation tests
        run: make test

      # The audit runs here in its degraded mode: a clean runner has no sealed artifact
      # and no Hugging Face cache, so the artifact-backed rows report `not_evidenced`
      # with a reason. It still exercises the ownership contract and the verdict rules,
      # and its verdict matches a fully-evidenced local run because environmental gaps
      # are reported separately from failure causes.
      #
      # This step is enforced: a failure here fails the job. It was masked with
      # `continue-on-error: true` while the truthful verdict was `FAIL`; that masking was
      # removed once the degraded audit reported `PASS` on a clean runner, because
      # keeping it would hide a regression behind a green conclusion.
      #
      # Quote the layer you actually ran when reporting a failure:
      # `scripts/validate_acceptance.py` exits 1, while `make` reports `Error 1` and
      # exits 2 because the recipe failed.
      - name: Audit acceptance evidence
        run: make acceptance
