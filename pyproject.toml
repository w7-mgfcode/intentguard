[project]
name = "intentguard"
version = "0.1.0"
description = "Confidence-aware support intent classification with selective prediction"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [{ name = "w7-mgfcode" }]
dependencies = [
  "datasets>=3.0,<5",
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.5,<2",
  "torch>=2.4,<3",
  "transformers>=4.45,<6",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  # `fastapi.testclient` needs an HTTP client. It resolves today only as a
  # transitive dependency of `datasets`/`huggingface-hub`, so NFR-008 requires
  # declaring it here: otherwise a future bump of either could remove the API
  # test suite's transport without changing a single test.
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.11.8"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
